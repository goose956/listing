<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Listings Assistant</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div id="app">

    <!-- Login view -->
    <div id="login-view">
      <div class="brand">
        <div class="brand-icon">LA</div>
        <h1>Listings Assistant</h1>
        <p class="brand-sub">Sign in to see your Vinted queue</p>
      </div>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        </div>
        <p id="login-error" class="error hidden"></p>
        <button type="submit" id="login-btn" class="btn-primary">Log in</button>
      </form>
    </div>

    <!-- Queue view -->
    <div id="queue-view" class="hidden">
      <div class="topbar">
        <span class="topbar-title">Listings Assistant</span>
        <button id="logout-btn" class="btn-ghost">Sign out</button>
      </div>
      <div class="platform-tabs" id="platform-tabs"></div>
      <div id="queue-hint" class="hint hidden"></div>
      <div id="queue-list"></div>
      <p id="queue-error" class="error hidden"></p>
    </div>

  </div>
  <script type="module" src="./popup.ts"></script>
</body>
</html>
